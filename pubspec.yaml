name: face_recognition_app
description: A beautiful Flutter face recognition application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Animation
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Camera & Image Processing
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.7

  # Face Detection
  google_ml_kit: ^0.16.3

  # State Management
  provider: ^6.1.1

  # Permissions
  permission_handler: ^11.2.0

  # Utils
  path_provider: ^2.1.2
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
